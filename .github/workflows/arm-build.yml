name: ARM build check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests for BK4829 adapter
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_bk4829_driver.c src/bk4829_drv.c -o build/test_bk4829_driver
          ./build/test_bk4829_driver
      - name: DSP no-cascade and waterfall isolation tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_dsp_no_cascade.c src/stabilizer.c src/median3.c src/waterfall.c src/calib.c -o build/test_dsp_no_cascade
          ./build/test_dsp_no_cascade
          if grep -q 'sweep_average(spec_raw' src/main.c; then echo 'Cross-sweep averaging is forbidden in live trace'; exit 1; fi
          grep -Eq 'median3\\(spec_raw\\[i[[:space:]]*-[[:space:]]*1\\]' src/main.c
          grep -Eq 'spec_avg\\[i\\][[:space:]]*/[[:space:]]*4' src/main.c
          if grep -q 'agc_process' src/main.c; then echo 'Per-bin software AGC is forbidden in live sweep'; exit 1; fi
          if grep -q 'bk4829_afc_is_valid' src/main.c; then echo 'Unvalidated AFC must not gate spectrum processing'; exit 1; fi
      - name: Adaptive sweep frequency mapping tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_sweep_mapping.c src/sweep_engine.c -o build/test_sweep_mapping
          ./build/test_sweep_mapping
      - name: Stabilizer regression tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_stabilizer.c src/stabilizer.c -o build/test_stabilizer
          ./build/test_stabilizer
      - name: Peak tracker regression tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_peak_tracker.c src/peak_tracker.c -o build/test_peak_tracker
          ./build/test_peak_tracker
      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build and validate UV-K1 V3 image
        run: make clean all check-image
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: uv-k1-v3-spectrum-build
          path: |
            build/uvk1_spectrum.elf
            build/uvk1_spectrum.bin
            build/uvk1_spectrum.map
