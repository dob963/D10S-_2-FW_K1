name: ARM build check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests for BK4829 adapter
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_bk4829_driver.c src/bk4829_drv.c -o build/test_bk4829_driver
          ./build/test_bk4829_driver
      - name: DSP no-cascade and waterfall isolation tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_dsp_no_cascade.c src/stabilizer.c src/median3.c src/waterfall.c src/calib.c -o build/test_dsp_no_cascade
          ./build/test_dsp_no_cascade
          if grep -q 'sweep_average(spec_raw' src/main.c; then echo 'Cross-sweep averaging is forbidden in live trace'; exit 1; fi
          grep -q 'spec_med_in' src/main.c
          grep -q 'bk4829_afc_is_valid' src/main.c
          if grep -q 'median3(spec_avg' src/main.c; then echo 'In-place median cascade is forbidden'; exit 1; fi
      - name: Adaptive sweep frequency mapping tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinc tests/test_sweep_mapping.c src/sweep_engine.c -o build/test_sweep_mapping
          ./build/test_sweep_mapping
      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build raw application image
        run: make clean all
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: uv-k1-v3-spectrum-build
          path: |
            build/spectrum_k1_v3.elf
            build/spectrum_k1_v3.bin
            build/spectrum_k1_v3.map
